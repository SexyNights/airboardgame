# Synology DS223j-class ARM NAS: run the app files built on a PC on top of the
# official multi-arch node/nginx images (no build on the NAS).
# Generated into the bundle by docker/build-nas-bundle.sh.
services:
  backend:
    image: node:22-bookworm-slim
    restart: unless-stopped
    # Runs as root inside the container: DSM share ACLs can block uid 1000
    # from writing ./data even after chown.
    working_dir: /app
    command: ["node", "src/server.js"]
    env_file: .env.docker
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4050
      STORE_BACKEND: nedb
      NEDB_BACKEND_DIRNAME: /data/db
      FILE_STORAGE: disk
      DISK_DESTINATION: /data/media
      MAX_UPLOAD_MB: 20
    volumes:
      - ./backend:/app:ro
      - ./data:/data
    mem_limit: 384m

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8262:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
