server {
    listen 80;
    server_name _;
    # Uploads are limited to MAX_UPLOAD_MB (20) by the backend; session saves
    # (JSON) can be up to 20 MB.
    client_max_body_size 25m;
    server_tokens off;
    # Keep the site out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Session saves are often >16k; keep them in memory instead of temp files
    client_body_buffer_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # API (the client calls /airboardgame/...)
    location /airboardgame/ {
        proxy_pass http://backend:4050;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:4050;
    }

    # Socket.IO (WebSocket)
    location /socket.io/ {
        proxy_pass http://backend:4050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
